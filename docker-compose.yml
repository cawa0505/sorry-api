services:
  sorry-api:
    build: .
    ports:
      - "${SORRY_PORT:-8080}:8080"
    environment:
      SORRY_MCP_TRANSPORT: "${SORRY_MCP_TRANSPORT:-http}"
    healthcheck:
      # bash /dev/tcp — zero extra deps in the runtime image (no curl).
      test:
        - CMD
        - bash
        - -c
        - exec 3<>/dev/tcp/127.0.0.1/8080
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    restart: unless-stopped